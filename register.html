<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BalangayLog - Resident Registration</title>
    <style>
        :root {
            --bg-dark: #0b1528;
            --primary: #1e3a8a;
            --primary-hover: #172554;
            --border-color: #cbd5e1;
            --text-main: #0f172a;
            --text-sub: #64748b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .register-card {
            background: #ffffff;
            width: 100%;
            max-width: 460px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }
        .header {
            background: var(--bg-dark);
            color: #ffffff;
            padding: 24px;
            text-align: center;
        }
        .header h2 { font-size: 1.35rem; margin-bottom: 6px; }
        .header p { font-size: 0.82rem; color: #94a3b8; }
        .form-body { padding: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 6px;
        }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.88rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control:focus { border-color: var(--primary); }
        .btn-register {
            width: 100%;
            padding: 12px;
            background: var(--bg-dark);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }
        .btn-register:hover { background: var(--primary-hover); }
        .footer-text {
            text-align: center;
            margin-top: 18px;
            font-size: 0.82rem;
            color: var(--text-sub);
        }
        .footer-text a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .alert-box {
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.82rem;
            margin-bottom: 16px;
            display: none;
        }
        .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #f87171; }
        .alert-success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    </style>
</head>
<body>

<div class="register-card">
    <div class="header">
        <h2>BalangayLog</h2>
        <p>Resident Portal Account Registration</p>
    </div>
    <div class="form-body">
        <div id="alertBox" class="alert-box"></div>

        <form id="registerForm">
            <div class="form-group">
                <label>Full Legal Name</label>
                <input type="text" id="regFullName" class="form-control" placeholder="Juan D. Dela Cruz" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="regEmail" class="form-control" placeholder="juan@example.com" required>
            </div>
            <div class="form-group">
                <label>Mobile Contact Number</label>
                <input type="text" id="regPhone" class="form-control" placeholder="09XXXXXXXXX" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" class="form-control" placeholder="Minimum 6 characters" required>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="regConfirmPassword" class="form-control" placeholder="Re-enter password" required>
            </div>
            <button type="submit" id="btnSubmitReg" class="btn-register">Create Resident Account</button>
        </form>

        <div class="footer-text">
            Already have an account? <a href="index.html">Log In here</a>
        </div>
    </div>
</div>

<script>
    const regForm = document.getElementById('registerForm');
    const alertBox = document.getElementById('alertBox');
    const btnSubmit = document.getElementById('btnSubmitReg');

    function showAlert(msg, isError = true) {
        alertBox.className = isError ? 'alert-box alert-error' : 'alert-box alert-success';
        alertBox.innerText = msg;
        alertBox.style.display = 'block';
    }

    regForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.style.display = 'none';

        const fullName = document.getElementById('regFullName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const password = document.getElementById('regPassword').value;
        const confirmPassword = document.getElementById('regConfirmPassword').value;

        if (password.length < 6) {
            showAlert('Password must be at least 6 characters long.');
            return;
        }

        if (password !== confirmPassword) {
            showAlert('Passwords do not match.');
            return;
        }

        btnSubmit.disabled = true;
        btnSubmit.innerText = 'Creating account...';

        try {
            const res = await fetch('api/register.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fullName, email, phone, password })
            });

            const data = await res.json();

            if (data.success) {
                showAlert('Account registered successfully! Redirecting to login...', false);
                regForm.reset();
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            } else {
                showAlert(data.message || 'Registration failed.');
            }
        } catch (err) {
            showAlert('Could not connect to the server.');
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.innerText = 'Create Resident Account';
        }
    });
</script>

</body>
</html>
